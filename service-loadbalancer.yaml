apiVersion: v1
kind: Service
metadata:
  name: spring-app-loadbalancer
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: spring-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      name: http
  # Optional: sticky sessions
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

