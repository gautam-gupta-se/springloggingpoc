apiVersion: v1
kind: Service
metadata:
  name: spring-app-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: spring-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080  # Optional: specify a port (30000-32767), omit for auto-assignment
      name: http

